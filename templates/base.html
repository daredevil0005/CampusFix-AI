<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CampusFix AI{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><a class="skip-link" href="#main-content">Skip to main content</a><header class="top"><a class="brand" href="/"><span class="mark">C</span> CampusFix <b>AI</b></a><nav><a href="/">Report an issue</a><a href="/admin/login">Staff portal</a></nav></header><main id="main-content" tabindex="-1">{% with messages=get_flashed_messages(with_categories=true) %}{% for kind,msg in messages %}<div class="toast {{kind}}" role="{{ 'alert' if kind == 'error' else 'status' }}">{{msg}}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main><footer>CampusFix AI <span>·</span> Campus maintenance, made trackable</footer><script src="{{url_for('static',filename='app.js')}}"></script></body></html>
